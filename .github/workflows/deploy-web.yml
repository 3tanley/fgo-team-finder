name: Deploy web (GitHub Pages)

# Replaces upstream's workflow, which published to chaldea-center/app and an Alibaba OSS bucket.
on:
  push:
    branches:
      - team-finder
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: "pubspec.yaml"
          cache: true

      - run: flutter pub get

      - name: Build web
        run: |
          dart ./scripts/gen_git_info.dart
          dart ./scripts/patch_before_build.dart web
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"
          dart ./scripts/patch_web_build.dart

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
